<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173553">
  <title>JF Apps — Hors connexion</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17212b;
      background: #eef3f7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 0%, rgba(88,123,158,.18), transparent 28rem),
        linear-gradient(180deg, #f8fafc 0%, #eef3f7 100%);
    }
    main {
      width: min(100%, 430px);
      padding: 28px;
      text-align: center;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(23,53,83,.12);
      border-radius: 22px;
      box-shadow: 0 16px 42px rgba(23,53,83,.12);
    }
    img {
      width: 112px;
      height: 112px;
      border-radius: 24px;
    }
    h1 {
      margin: 18px 0 8px;
      color: #173553;
    }
    p {
      margin: 8px 0;
      line-height: 1.5;
      color: #647484;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 18px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: #173553;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/pwa-icon-192.png" alt="Logo JF Apps">
    <h1>Connexion indisponible</h1>
    <p>JF Apps a besoin d’une connexion au serveur pour afficher et modifier les listes partagées.</p>
    <p>Vérifiez votre connexion Internet, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
